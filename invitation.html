<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  CSP. Cette page ne manipule ni session, ni token, ni donnée d'invité : elle
  n'appelle aucune API. Elle a donc besoin de deux autorisations que la page
  RSVP n'a pas, et d'aucune des siennes :
    · media-src 'self'  pour la musique d'ambiance ;
    · frame-src         pour le plan OpenStreetMap.
  OpenStreetMap plutôt que Google Maps : pas de clé d'API, et pas de pistage
  des invités par un tiers publicitaire.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  img-src 'self' data:;
  font-src 'self';
  media-src 'self';
  frame-src https://www.openstreetmap.org;
  form-action 'none';
  base-uri 'none'">

<title>Alec &amp; Gloria — Invitation</title>
<meta name="description" content="Alec et Gloria ont la joie de vous inviter à leur mariage.">
<meta name="theme-color" content="#ece4d5">

<!--
  Open Graph : c'est l'aperçu affiché dans WhatsApp, iMessage et Signal.
  Ces balises sont lues par des robots qui n'exécutent PAS de JavaScript :
  elles ne peuvent pas venir de invitation.config.js et doivent être
  mises à jour ici à la main, en même temps que la config.
  L'URL de l'image doit être absolue — un chemin relatif n'est pas suivi.
-->
<meta property="og:type"        content="website">
<meta property="og:locale"      content="fr_FR">
<meta property="og:site_name"   content="Alec &amp; Gloria">
<meta property="og:title"       content="Alec &amp; Gloria — 12 juin 2027">
<meta property="og:description" content="Nous avons la joie de vous inviter à notre mariage.">
<meta property="og:url"         content="https://harry-deg.github.io/guestbook/invitation.html">
<meta property="og:image"       content="https://harry-deg.github.io/guestbook/assets/img/og.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"   content="Alec et Gloria devant le lieu de réception.">
<meta name="twitter:card"       content="summary_large_image">

<link rel="stylesheet" href="assets/css/invitation.css">
</head>
<body>

<!-- ═══ Enveloppe ═══════════════════════════════════════════════════════ -->
<div class="enveloppe papier" id="enveloppe">
  <div class="enveloppe__corps">

    <svg class="enveloppe__plis" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 L46 70"   stroke="#d8cbb2" stroke-width=".25" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="M100 30 L54 70" stroke="#d8cbb2" stroke-width=".25" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="M0 100 L46 72 Q50 69.5 54 72 L100 100" stroke="#ddd2bd" stroke-width=".25" fill="none" vector-effect="non-scaling-stroke"/>
    </svg>

    <!-- Rabat : bord inférieur incurvé vers le milieu de l'écran. -->
    <div class="rabat">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gRabat" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3ecdd"/>
            <stop offset="1" stop-color="#e7dcc6"/>
          </linearGradient>
        </defs>
        <path d="M0 0 H100 V60 Q50 105 0 60 Z" fill="url(#gRabat)"/>
        <path d="M0 60 Q50 105 100 60" fill="none" stroke="#d2c3a4" stroke-width=".6" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <button class="sceau" id="sceau" type="button" aria-label="Ouvrir l&rsquo;invitation">
      <span aria-hidden="true">A&amp;G</span>
    </button>

    <p class="enveloppe__appel label" id="texte-ouvrir">Toucher le sceau pour ouvrir</p>
  </div>
</div>

<!-- ═══ Flottants ═══════════════════════════════════════════════════════ -->
<button id="langue" class="flottant" type="button" aria-label="Switch to English">
  <!-- Les deux drapeaux sont dans le balisage et l'on bascule leur visibilité :
       la règle 6 du projet interdit innerHTML, y compris pour du SVG constant. -->
  <svg width="16" height="11" viewBox="0 0 3 2" aria-hidden="true">
    <g id="drapeau-fr">
      <rect width="1" height="2" fill="#30479b"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#d8443d"/>
    </g>
    <g id="drapeau-en" hidden>
      <rect width="3" height="2" fill="#24387a"/>
      <path d="M0 0L3 2M3 0L0 2" stroke="#fff" stroke-width=".45"/>
      <path d="M1.5 0V2M0 1H3" stroke="#fff" stroke-width=".6"/>
      <path d="M1.5 0V2M0 1H3" stroke="#c8323a" stroke-width=".32"/>
    </g>
  </svg>
  <span id="code-langue">FR</span><span aria-hidden="true">&#9662;</span>
</button>

<button id="musique" class="flottant" type="button" aria-label="Lancer la musique" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/>
    <g id="ondes"><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></g>
    <g id="coupe" hidden><path d="M16 10l4 4M20 10l-4 4"/></g>
  </svg>
</button>
